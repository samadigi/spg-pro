<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Mencegah zoom otomatis dan menyesuaikan poni layar (notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SALES PRO</title> 
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh; /* Fallback browser lama */
      height: 100dvh; /* SOLUSI UTAMA: Dynamic Viewport Height */
      overflow: hidden; 
      background-color: #0f172a; 
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

   src="https://script.google.com/macros/s/AKfycbwEKlukA74BU5MC94f47GJEkCxzIT-KWHU0b87MNHu-Vbm8GQiv2lgbLy9H2_GlzSM0lg/exec"
